---
layout: base
---
<div class="container">
  <article class="page">
    <h1 class="page-title" id="page-title">{{ page.title }}</h1>
    {% if page.date %}
    <p class="post-date">{{ page.date | date: "%B %-d, %Y" }}</p>
    {% endif %}

    <div class="page-content">
      {{ content }}
    </div>
  </article>
</div>
